<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Styling Examples</title>
    <!-- Internal CSS -->
    <style>
        h2 {
            color: green;
        }
    </style>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <hr>
    <!-- Inline CSS -->
    <h1 style="color: red;">My Webpage</h1>
    <!-- Internal CSS -->
    <h2>Hobbies</h1>
        <!-- External CSS -->
        <h3>My Playlist</h3>
        <hr>

        <!-- element selector example -->
        <h4 style="color: Blue; font-size: 40px;">I like to style my page</h4>
        <h4>ELEMENT SELECTOR EXAMPLE</h4>

        <!-- group selector example -->
        <h5>GROUP SELECTOR EXAMPLE</h5>
        <p>GROUP SELECTOR EXAMPLE</p>
        <hr>

</body>

</html>
